<svg width="65" height="65" viewBox="-5 -5 75 75" fill="none" xmlns="http://www.w3.org/2000/svg">
      <style>
        .icon {
          transform-origin: center center;
          transform: scale(0.8);
          filter: grayscale(1);
          opacity: 0.3;
          transition: transform 0.1s ease-out 5s, filter 0.1s ease-out 60s, opacity 0.1s ease-out 60s;
        }

        .icon:hover {
          transform: scale(1.1);
          filter: grayscale(0);
          opacity: 1;
          transition-delay: 0s;
        }
      </style>
      <a href="https://angular.dev" target="_blank">
