<svg width="65" height="65" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

<defs>
    <clipPath id="rounded-corners">
      <rect x="0" y="0" width="65" height="65" rx="10" ry="10" />
    </clipPath>
  </defs>

<style>

    <style>
    .icon {
      transform-origin: center center;
      transform: translateY(3px) scale(0.8);
      filter: grayscale(1);
      opacity: 0.3;
      transition: transform 0.1s ease-out 5s, 
                  filter 0.1s ease-out 5s, 
                  opacity 0.1s ease-out 5s;
    }


    .icon:hover {
      transform: scale(1.1);
      filter: grayscale(0);
      opacity: 1;
      transition-delay: 0s;
    }
  </style>

  <a href="https://angular.dev" target="_blank">
    <image class="icon" x="0" y="0" width="65" height="65" 
           href="../angular.svg" clip-path="url(#rounded-corners)"/>
  </a>
</svg>